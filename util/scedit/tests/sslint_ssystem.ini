# scedit fixture -- the LEGACY regime, one construct per armed rule.
# Named `*_ssystem.ini` because the regime is chosen by LOCATION: this file has
# to be classified legacy by its NAME, which is exactly what the gate proves.
# Every line below is deliberate; a line that stops producing its finding, or
# one that starts producing a second, fails ss_lint_rules.

[sun]
name = TheSun
type = Sun
coord_func = sun_special
radius = 696000.

# A body that must stay SILENT: ordinary legacy keys, a column-0 comment above
# it, and a `type` value in the legacy domain.
[quiet]
name = QuietBody
parent = TheSun
type = Moon
coord_func = ell_orbit
orbit_period = 27.3
halo = true
hidden = false

# HARD: the three structural keys a legacy file may not carry (D13).
[newformat]
name = NewFormatBody
parent = TheSun
type = Moon
coord_func = ell_orbit
relation = grounded
compose = explicit

# HARD: a module-section header in a legacy file.
[NewFormatBody:MESH]
body = NewFormatBody
type = MESH

# The `type` value domain: BODY is the composed marker and is NOT a legacy body
# type, so here it is a value-domain finding and not a free pass.
[bodymarker]
name = BodyMarker
parent = TheSun
type = BODY
coord_func = ell_orbit

# Duplicate name: the identity rule (D34).
[twin]
name = QuietBody
parent = TheSun
type = Moon
coord_func = ell_orbit

# An unknown key, near enough to a real one that the did-you-mean must fire.
[typo]
name = TypoBody
parent = TheSun
type = Moon
coord_func = ell_orbit
orbit_Period = 12.5

# A mid-line comment: the two readers of this file disagree about it.
[midcomment]
name = MidComment
parent = TheSun
type = Moon
coord_func = ell_orbit
rot_periode = 24 # hours

# A line with no '=' at all.
[malformed]
name = Malformed
parent = TheSun
type = Moon
coord_func = ell_orbit
orbit_LongOfPericenter 95.5

# The legacy substr arithmetic: no space around the '=' truncates the key.
[spacing]
name = Spacing
parent = TheSun
type = Moon
coord_func = ell_orbit
orbit_eccentricity=0.5

# Booleans: `on` is TRUE to one loader and FALSE to the other; `yes` is false to
# both and nothing says so at run time.
[bools]
name = Bools
parent = TheSun
type = Moon
coord_func = ell_orbit
halo = on
hidden = yes

[end]
