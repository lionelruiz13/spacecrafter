# scedit fixture -- the COMPOSED regime. Its directory is what selects the
# regime, so the SAME `relation`/`compose` lines that are hard errors in the
# legacy fixture must be SILENT here. That pair is the discrimination.

[ComposedBody]
name = ComposedBody
parent = none
type = Sun
coord_func = sun_special
radius = 696000.
relation = orbiting
compose = explicit
light_source = true

# A module section: `body =` is what makes it one, and `type` then names the
# FAMILY rather than a body type.
[ComposedBody:MESH]
body = ComposedBody
type = MESH

# A module section whose family does not exist.
[ComposedBody:NOSUCH]
body = ComposedBody
type = NOSUCH

# `type = BODY` on a composed NODE is the canonical body-type-less marker and
# must be silent here, where it is a finding in a legacy file (INTENT 11.89(c)).
[Marker]
name = Marker
parent = ComposedBody
type = BODY
coord_func = still_orbit

# A suppression switch read the opposite way round: `no` does NOT turn it off.
[Suppress]
name = Suppress
parent = ComposedBody
type = Moon
coord_func = ell_orbit
hint = no
