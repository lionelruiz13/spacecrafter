#!sc: [d5-defaults-are-not-per-body] These four are the colours a body gets when its declaration names none. Changing one recolours NO existing body - only the ones loaded afterwards - which is why they cannot be recovered from the [body:*] sections and have their own place here (b31-design §2 row D5).

