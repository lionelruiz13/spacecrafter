#!sc: [values-not-carried] Of 43 `set` values this build knows, this session carries 22. Left out on purpose: `home_planet` and `zoom_offset` belong to [observer]; `heading` is DECISIONS_PENDING D28's mandated carve-out (what it means across a reference change is unanswered, and a saved number would bake in an answer nobody gave); `landscape_name` needs the pin-vs-auto distinction its own row (§2 F1) carries, and the name alone would silently turn a pin into a coincidence; the timezone and the date/time display formats are §2 row A6 preferences the config channel already persists. Left out because they cannot be READ - there is no getter anywhere in the tree, so nothing here can be written honestly: moon_brightness, sun_brightness, milky_way_fader_duration, zodiacal_intensity, milky_way_texture, star_fader_duration, text_fading_duration, screen_fader (§2 row H6 wants it), stall_radius_unit, datetime_display_position, datetime_display_number, init_fov - and `mode`, which writes nothing at all (§2 row K3).

