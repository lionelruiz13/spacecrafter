#!sc: heading [excluded-pending-D28] `heading` is NOT part of this session. What it MEANS across a change of reference body is an open product question (DECISIONS_PENDING D28 / INTENT A38): the new path holds the whole orientation across a switch, so the heading PARAMETER is rewritten by that switch and a saved number would bake an answer nobody has given. A restored session therefore keeps the heading the running app already has. To fix: answer D28, then add `heading` here.

