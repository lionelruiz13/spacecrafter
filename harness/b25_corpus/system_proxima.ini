# F5 / B25-galactic TEST CORPUS - a foreign star system in the LEGACY format.
# SYNTHETIC VALUES: no number here is a fetched physical constant and none is
# presented as one (INTENT 11.51(d) red line). Structure and key spellings are
# copied from ~/.spacecrafter/ssystem.ini sections ([sun]/[saturn]/[io]/[Pallas]/
# [phobos]); orbital elements are made up to be well-formed, not accurate.
# Coverage this file is built for: light_source, surface_model, trail_length,
# shadow_exempt emission; RING/MESH/AXIS/HINT/ORBIT/TRAIL/TAIL/OJM/CUSTOM/GRID
# deduction; bound_to_surface -> relation = grounded translation; a 4-deep
# parent chain (section order is load-bearing); an ISO-8859 value byte; an
# unknown key; an unnamed section; an orphan section.

