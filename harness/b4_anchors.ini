#
# B4 test anchors (INTENT §11.111, task F7) - appended to the SHIPPED anchor.ini
# by b4_anchors_run.sh inside the temp-HOME farm.  Channel 1 of §2(c): every
# key here is the file grammar the field anchor.ini already uses, plus the one
# proposed key `follow_rotation` (spelling awaiting sign-off, B28 protocol).
#
# EVERY VALUE IS SYNTHETIC and chosen to make a prediction exact - none is a
# recalled physical constant (§11.51(d)).  The orbit below is a circle
# (eccentricity 0, inclination 0, pericenter/node/mean longitude 0) of radius
# 200000 km and period 0.5 d, so |ecl| = 200000 km at every date and the chord
# over dt is exactly 2*a*sin(pi*dt/P).
#

# (3) ON-ORBIT - the PRIMARY kind [R3]: a point riding a circular orbit around
# the Moon.  The camera anchored here must hold through the Moon's own motion.
[b4]
name = b4_orbit_moon
type = orbit
parent = Moon
coord_func = ell_orbit
orbit_period = 0.5
orbit_epoch = 2451545.0
orbit_eccentricity = 0.0
orbit_inclination = 0.0
orbit_ascendingnode = 0.0
orbit_longofpericenter = 0.0
orbit_meanlongitude = 0.0
orbit_semimajoraxis = 200000.0

# (2) BODY-ATTACHED KEEPING THE ANGLE - the NEEDED GAP [R3]: attached to Mars,
# NOT following its rotation, so the approach angle is preserved as it spins.
[b4]
name = b4_mars_keepangle
type = body
body_name = Mars
follow_rotation = false

# (2') the same kind with the rotation FOLLOWED - the in-scene discriminator
# (today's default behaviour for a body reference), declared explicitly.
[b4]
name = b4_mars_follow
type = body
body_name = Mars
follow_rotation = true

# (1) FIXED POINT [R3: Universe-mode only]: a point 10 AU from the universe
# centre along +x.  Nothing moves in that frame - which is the whole reason the
# kind is Universe-scoped.
[b4]
name = b4_fixed
type = point
x = 10.0
y = 0.0
z = 0.0

